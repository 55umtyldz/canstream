name: Build and Publish

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'reports/**'
  workflow_dispatch:

concurrency:
  group: "build-publish"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: "src"
          fetch-depth: 0

      - name: Fast Fail — Validate Pre-Build Repository Consistency
        run: |
          python src/tools/validate_repo.py

      - name: Enforce Version Bump Invariant
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE_SHA="${{ github.event.before }}"
          else
            BASE_SHA="HEAD^"
          fi
          echo "Determined BASE_SHA: $BASE_SHA"
          python src/tools/verify_version_bumps.py --base "$BASE_SHA"

      - name: Check Dependency Verification Gate Tooling
        run: python3 -m unittest discover -s src/tools/tests -p 'test_dependency_verification_gate.py'

      - name: Set up JDK 17 with Gradle Cache
        uses: actions/setup-java@5d7b2146334bacf88728daaa70414a99f5164e0f # v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: 'src/**/*.gradle*'

      # A clean dependency resolver catches missing POM/.module checksums before
      # Kotlin compile, plugin packaging and (on main) any publication begins.
      - name: Dependency Verification Gate (fresh Gradle home)
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/cloudstream-dependency-verification
        run: |
          cd src/
          bash tools/run_dependency_verification_gate.sh

      - name: Upload Dependency Verification Diagnostics (on failure)
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: dependency-verification-${{ github.run_id }}-build
          path: |
            src/dependency-verification-report/
            src/build/reports/dependency-verification/
          if-no-files-found: ignore
          retention-days: 7

      - name: Run Provider Unit Tests
        run: |
          cd src
          chmod +x gradlew
          ./gradlew testDebugUnitTest --parallel --continue

      - name: Build Plugins (.cs3) & Generate plugins.json
        run: |
          cd src
          ./gradlew make makePluginsJson

      - name: Validate Generated Artifacts Integrity
        run: |
          cd src
          python tools/validate_repo.py --verify-artifacts

      - name: Generate Dynamic Build Report
        run: |
          cd src
          python tools/generate_build_report.py

      - name: Stage Artifacts Atomically
        run: |
          mkdir -p staging
          cp src/repo.json staging/
          cp src/build/plugins.json staging/
          find src -name "*.cs3" -exec cp {} staging/ \;

      - name: Verify Staging Invariant (providers.json == plugins.json == *.cs3)
        run: |
          python -c '
          import json, glob, os, sys
          with open("src/config/providers.json") as f:
              p_conf = json.load(f)
          enabled = sorted([p["module"] for p in p_conf.get("providers", []) if p.get("enabled", True)])
          with open("staging/plugins.json") as f:
              plugins = json.load(f)
          plugin_names = sorted([p["internalName"] for p in plugins])
          cs3_files = sorted([os.path.splitext(os.path.basename(x))[0] for x in glob.glob("staging/*.cs3")])
          print(f"Enabled in providers.json ({len(enabled)}): {enabled}")
          print(f"InternalNames in plugins.json ({len(plugin_names)}): {plugin_names}")
          print(f"Staged .cs3 files ({len(cs3_files)}): {cs3_files}")
          if enabled != plugin_names:
              print(f"MISMATCH: enabled ({enabled}) != plugins.json ({plugin_names})")
              sys.exit(1)
          if enabled != cs3_files:
              print(f"MISMATCH: enabled ({enabled}) != staged .cs3 ({cs3_files})")
              sys.exit(1)
          print(f"ALL INVARIANTS PASSED: Exactly {len(enabled)} active providers verified across all layers.")
          '

      - name: Checkout or Bootstrap Builds Branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: "builds"
          path: "builds-dest"
        continue-on-error: true

      - name: Publish Artifacts to builds Branch
        run: |
          if [ ! -d "builds-dest/.git" ]; then
            echo "Initializing orphan builds branch..."
            git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds-dest
            cd builds-dest
            git checkout --orphan builds
            git rm -rf . || true
          else
            cd builds-dest
            git rm -rf *.cs3 plugins.json repo.json || true
          fi

          cp -r ../staging/* .
          count=$(ls -1 *.cs3 2>/dev/null | wc -l)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Automated publication: ${{ github.sha }} ($count active providers)" || exit 0
          git push origin builds --force
