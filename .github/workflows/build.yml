name: Build and Publish

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'reports/**'
  workflow_dispatch:

concurrency:
  group: "build-publish"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          path: "src"
          fetch-depth: 0

      - name: Set up JDK 17 with Gradle Cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: 'src/**/*.gradle*'

      - name: Build Plugins (.cs3) & Generate plugins.json
        run: |
          cd src
          chmod +x gradlew
          ./gradlew make makePluginsJson

      - name: Stage Artifacts Atomically
        run: |
          mkdir -p staging
          [ -f src/repo.json ] && cp src/repo.json staging/ || true
          [ -f src/build/plugins.json ] && cp src/build/plugins.json staging/ || true
          find src -name "*.cs3" -exec cp {} staging/ \;

      - name: Checkout or Bootstrap Builds Branch
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds-dest"
        continue-on-error: true

      - name: Publish Artifacts to builds Branch
        run: |
          if [ ! -d "builds-dest/.git" ]; then
            echo "Initializing orphan builds branch..."
            git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds-dest
            cd builds-dest
            git checkout --orphan builds
            git rm -rf . || true
          else
            cd builds-dest
            git rm -rf *.cs3 plugins.json repo.json || true
          fi

          cp -r ../staging/* .
          count=$(ls -1 *.cs3 2>/dev/null | wc -l)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Automated publication: ${{ github.sha }} ($count active providers)" || exit 0
          git push origin builds --force
