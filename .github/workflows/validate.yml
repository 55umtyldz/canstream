name: Validate

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'reports/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast Fail — Validate Repository Schema & Metadata
        run: |
          python tools/validate_repo.py

      - name: Enforce Version Bump Invariant
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE_SHA="${{ github.event.before }}"
          else
            BASE_SHA="HEAD^"
          fi
          echo "Determined BASE_SHA: $BASE_SHA"
          python tools/verify_version_bumps.py --base "$BASE_SHA"

      - name: Set up JDK 17 with Gradle Cache
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Compile and Run All Provider Unit Tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --parallel --continue

      # A PR is not published to the builds branch. Provide a testable .cs3
      # without changing the live extension repository.
      - name: Build CloudStreamHub PR plugin (do not publish)
        if: github.event_name == 'pull_request'
        run: |
          ./gradlew :CloudStreamHub:make
          artifact_path="$(find . -type f -name 'CloudStreamHub.cs3' -print -quit)"
          test -n "$artifact_path" && test -s "$artifact_path"
          mkdir -p pr-test-artifact
          cp "$artifact_path" pr-test-artifact/CloudStreamHub.cs3

      - name: Upload CloudStreamHub test plugin
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: CloudStreamHub-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: pr-test-artifact/CloudStreamHub.cs3
          if-no-files-found: error
          retention-days: 14
